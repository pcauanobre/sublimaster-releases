<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SubliMaster — Automação de Sublimação no CorelDRAW</title>
<meta name="description" content="Automatize seu fluxo de sublimação: encaixe, repasse, exporte e imprima direto do CorelDRAW. Reduza horas de trabalho manual a minutos." />

<link rel="icon" type="image/png" href="logo.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:        '#0a0e13',
          surface:   '#13181f',
          border:    '#262d36',
          accent:    '#3b82f6',
          text:      '#e6edf3',
          textDim:   '#8b95a5',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ───────── BASE ───────── */
  html, body { height: 100%; }
  body {
    background: #060912;
    color: #e6edf3;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ───────── BACKGROUND LAYERS ───────── */
  .bg-mesh {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(59,130,246,0.18), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(168,85,247,0.15), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(236,72,153,0.10), transparent 50%);
    animation: meshDrift 20s ease-in-out infinite;
  }
  @keyframes meshDrift {
    0%, 100% { transform: scale(1) translate(0, 0); }
    50%      { transform: scale(1.1) translate(-2%, -2%); }
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(38,45,54,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,45,54,0.35) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 60% at center, black 30%, transparent 75%);
  }

  /* Floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(96,165,250,0.6), transparent 70%);
    filter: blur(1px);
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
  }

  /* ───────── TYPOGRAPHY ───────── */
  .gradient-text {
    background: linear-gradient(120deg, #60a5fa 0%, #a78bfa 35%, #ec4899 70%, #60a5fa 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 6s ease infinite;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ───────── ENTRANCES ───────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
  }
  .reveal {
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* ───────── LOGO ───────── */
  @keyframes float-y {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  .logo-hero {
    animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
               float-y 5s ease-in-out infinite 1.2s;
    filter:
      drop-shadow(0 10px 30px rgba(59,130,246,0.35))
      drop-shadow(0 30px 80px rgba(168,85,247,0.25));
  }

  /* ───────── BUTTON ───────── */
  .btn-primary {
    position: relative;
    background: linear-gradient(120deg, #3b82f6, #6366f1, #8b5cf6);
    background-size: 200% 200%;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow:
      0 10px 30px -10px rgba(59,130,246,0.4),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
    background-size: 200% 100%;
    background-position: -100% 0;
    transition: background-position 0.6s;
    pointer-events: none;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    background-position: 100% 50%;
    box-shadow:
      0 20px 50px -10px rgba(99,102,241,0.6),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary:hover::before {
    background-position: 200% 0;
  }

  /* ───────── FAB WHATSAPP ───────── */
  .fab-whatsapp {
    background: #25D366;
    box-shadow: 0 12px 30px -5px rgba(37,211,102,0.5);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .fab-whatsapp:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 20px 50px -5px rgba(37,211,102,0.75);
  }
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(37,211,102,0.6); }
    70%  { box-shadow: 0 0 0 22px rgba(37,211,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
  }
  .fab-pulse { animation: pulse-ring 2.4s infinite; }

  /* ───────── NAV ───────── */
  .nav-glass {
    backdrop-filter: blur(20px) saturate(180%);
    background: rgba(10, 14, 19, 0.6);
    border-bottom: 1px solid rgba(38, 45, 54, 0.6);
  }
</style>
</head>
<body>

<!-- BACKGROUND ANIMATED -->
<div class="bg-mesh"></div>

<div class="absolute inset-0 pointer-events-none overflow-hidden">
  <div class="particle" style="left: 10%; width: 4px; height: 4px; bottom: -10px; animation-duration: 18s; animation-delay: 0s;"></div>

  <div class="particle" style="left: 80%; width: 4px; height: 4px; bottom: -10px; animation-duration: 19s; animation-delay: 5s;"></div>
  <div class="particle" style="left: 90%; width: 6px; height: 6px; bottom: -10px; animation-duration: 24s; animation-delay: 9s;"></div>
</div>

    <a href="#" class="flex items-center gap-2.5 reveal" style="animation-delay:0.1s;">
      <img src="logo.png" alt="SubliMaster" class="w-8 h-8" style="filter: drop-shadow(0 4px 8px rgba(59,130,246,0.4));" />

</body>
